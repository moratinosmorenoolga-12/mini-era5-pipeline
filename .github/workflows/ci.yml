name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Instalar Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Instalar el paquete y dependencias de desarrollo
        run: pip install -e ".[dev]"

      - name: Ejecutar tests
        run: pytest -v

  docker:
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - uses: actions/checkout@v4

      - name: Construir la imagen
        run: docker build -t era5qc .

      - name: Ejecutar los tests dentro del contenedor
        run: docker run --rm era5qc
