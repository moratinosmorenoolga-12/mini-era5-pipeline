# Añade este trabajo al final de .github/workflows/ci.yml (dentro de "jobs:").
# Ejecuta el pipeline con datos sintéticos (sin clave del CDS) y guarda el
# dashboard como artefacto descargable desde la pestaña Actions.
  dashboard-demo:
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: python -m era5qc.pipeline --demo
      - uses: actions/upload-artifact@v4
        with:
          name: dashboard-demo
          path: outputs/
