# Configuración del pipeline ERA5 (fase 8).
# Cambia aquí el periodo, la zona o las variables: el código no se toca.

region:
  name: "Cataluña y alrededores"
  area: [44, -2, 39, 5]          # N, W, S, E (grados)

period:
  years: [2023]
  months: [1]                    # 1 = enero. Puedes poner [1, 2, 3] o [1, 7]
  # Horas UTC a descargar. Con las 24 horas la precipitación diaria es un
  # total real; con solo 00/06/12/18 es una estimación (ver docs/fase8.md).
  hours: all                     # "all" o una lista: ["00:00", "06:00", "12:00", "18:00"]

variables:
  - 2m_temperature
  - 10m_u_component_of_wind
  - 10m_v_component_of_wind
  - total_precipitation

# Puntos de interés: se usa la celda de la rejilla más cercana.
points:
  Barcelona:  [41.39, 2.17]
  Girona:     [41.98, 2.82]
  Lleida:     [41.62, 0.62]
  Tarragona:  [41.12, 1.25]
  Pirineo (Vall d'Aran): [42.70, 0.80]
  Zaragoza:   [41.65, -0.88]
  València:   [39.47, -0.38]
  Palma:      [39.57, 2.65]

paths:
  raw: data/raw                  # descargas (ZIP o NetCDF) y su descompresión
  outputs: outputs               # resultados del análisis y dashboard.html

qc:
  stop_on_fail: true             # si un control da FAIL, no se analiza nada

dashboard:
  title: "Panel climático ERA5"
  offline: true                  # true: el HTML funciona sin internet (~5 MB)
